<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jiji & pat library website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark"
      style="background-color: var(--accent)"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="#home">
          <img
            src="images/navbrand-transparent.png"
            alt="jiji & pat"
            height="60"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
            <li class="nav-item">
              <a class="nav-link" href="#about">About</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#team">Team</a></li>
            <li class="nav-item">
              <a class="nav-link" href="#favorite">Favorite</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <section class="main-hero">
        <div class="container my-0 my-lg-5">
          <div
            style="
              padding-top: 60px !important;
              padding-bottom: 20px !important;
            "
            class="row p-2 p-lg-4 pb-0 pt-lg-5 align-items-center rounded-3 shadow-lg overflow-hidden"
          >
            <div class="col-lg-7 p-3 p-lg-5 pt-lg-3">
              <h1 class="hero-title display-4 fw-bold lh-1 text-body-emphasis">
                Hi there! Welcome.
              </h1>
              <p class="lead">
                This is our cute strawberry-themed website, created to meet the
                Web Technologies (WebTech) project requirements. We hope you
                enjoy exploring!
              </p>
              <div
                class="d-grid gap-2 d-md-flex justify-content-md-start mb-4 mb-lg-3"
              >
                <button
                  type="button"
                  class="btn btn-primary btn-lg px-4 me-md-2 fw-bold"
                >
                  Get Started
                </button>
                <button
                  type="button"
                  class="btn btn-outline-primary btn-lg px-4"
                >
                  Contact
                </button>
              </div>
            </div>
            <div class="col-lg-5 p-0 d-flex pb-4">
              <img
                class="w-100 h-auto"
                src="/images/hero-imagetablet.png"
                alt="strawberry and ribbon"
                style="object-fit: cover; height: 100%"
              />
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
